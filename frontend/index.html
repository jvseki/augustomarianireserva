<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento de Notebooks</title>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="notebook-lines"></div>

  <div class="page-wrap">

    <header>
      <div class="header-top">
        <div class="logo-area">
          <div class="chalkboard-icon">💻</div>
          <div>
            <h1>Agendamento de Notebooks</h1>
            <p class="school-sub">📚 Sistema de Reservas — Laboratório de Informática</p>
          </div>
        </div>
        <button class="refresh-btn" onclick="carregarAgenda()">↺ Atualizar</button>
      </div>

      <div class="stats-row">
        <div class="stat-card green">
          <span class="stat-num" id="count-livre">—</span>
          <span class="stat-label">✏️ Livres</span>
        </div>
        <div class="stat-card blue">
          <span class="stat-num" id="count-reservado">—</span>
          <span class="stat-label">📌 Reservados</span>
        </div>
      </div>

      <div class="stock-row">
        <span class="stock-title">Disponibilidade:</span>
        <span class="stock-badge tablet" id="stock-tablet">📱 carregando...</span>
        <span class="stock-badge prata"  id="stock-prata">💻 carregando...</span>
        <span class="stock-badge preto"  id="stock-preto">🖥️ carregando...</span>
      </div>

      <div class="legend-row">
        <span class="legend-title">Legenda:</span>
        <span class="badge livre">● Livre</span>
        <span class="badge reservado">◆ Reservado</span>
        <span class="badge bloqueado">■ Bloqueado</span>
      </div>
    </header>

    <main>
      <div id="loading" class="loading-wrap">
        <div class="pencil-loader">✏️</div>
        <p class="loading-text">Carregando agenda...</p>
      </div>

      <div class="table-wrap" id="table-container" style="display:none">
        <table id="tabela"></table>
      </div>
    </main>

  </div>

  <!-- Modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <button class="modal-close" onclick="fecharModal()">×</button>
      <div class="modal-header">
        <span class="modal-emoji">📋</span>
        <div>
          <h2 id="modal-title">Reservar horário</h2>
          <p class="modal-sub" id="modal-sub">Selecione uma ação</p>
        </div>
      </div>

      <div id="acao-area">

        <!-- Formulário de reserva direto, sem escolha de ação -->
        <div id="reservar-form">
          <div class="input-group">
            <label>👤 Nome do professor(a)</label>
            <input type="text" id="nome-input" placeholder="Nome completo..."
              onkeydown="if(event.key==='Enter') document.getElementById('qtd-input').focus()">
          </div>

          <div class="input-group">
            <label>🎒 Tipo de equipamento</label>
            <div class="equip-grid">
              <button class="equip-btn tablet" onclick="selecionarEquip('tablet', this)">
                <span class="equip-emoji">📱</span>
                <span class="equip-name">Tablet</span>
                <span class="equip-max">carregando...</span>
              </button>
              <button class="equip-btn prata" onclick="selecionarEquip('prata', this)">
                <span class="equip-emoji">💻</span>
                <span class="equip-name">Note prata</span>
                <span class="equip-max">carregando...</span>
              </button>
              <button class="equip-btn preto" onclick="selecionarEquip('preto', this)">
                <span class="equip-emoji">🖥️</span>
                <span class="equip-name">Note preto</span>
                <span class="equip-max">carregando...</span>
              </button>
            </div>
            <p class="error-msg" id="equip-error" style="text-align:left; margin-top:4px"></p>
          </div>

          <div class="input-group">
            <label id="qtd-label">Quantidade</label>
            <input type="number" id="qtd-input" min="1" max="23" value="1"
              style="width: 100px"
              onkeydown="if(event.key==='Enter') confirmarAcao()">
          </div>
        </div>

        <button class="btn-primary" id="confirm-btn" onclick="confirmarAcao()" style="margin-top:8px">
          ✔ Confirmar Reserva
        </button>
      </div>

      <p class="error-msg" id="error-msg"></p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
