<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento de Notebooks</title>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="notebook-lines"></div>

  <div class="page-wrap">

    <header>
      <div class="header-top">
        <div class="logo-area">
          <div class="chalkboard-icon">💻</div>
          <div>
            <h1>Agendamento de Notebooks</h1>
            <p class="school-sub">📚 Sistema de Reservas — Laboratório de Informática</p>
          </div>
        </div>
        <button class="refresh-btn" onclick="carregarAgenda()">↺ Atualizar</button>
      </div>

      <div class="stats-row">
        <div class="stat-card green">
          <span class="stat-num" id="count-livre">—</span>
          <span class="stat-label">✏️ Livres</span>
        </div>
        <div class="stat-card blue">
          <span class="stat-num" id="count-reservado">—</span>
          <span class="stat-label">📌 Reservados</span>
        </div>
        <div class="stat-card red">
          <span class="stat-num" id="count-bloqueado">—</span>
          <span class="stat-label">🔒 Bloqueados</span>
        </div>
      </div>

      <div class="legend-row">
        <span class="legend-title">Legenda:</span>
        <span class="badge livre">● Livre</span>
        <span class="badge reservado">◆ Reservado</span>
        <span class="badge bloqueado">■ Bloqueado</span>
      </div>
    </header>

    <main>
      <div id="loading" class="loading-wrap">
        <div class="pencil-loader">✏️</div>
        <p class="loading-text">Carregando agenda...</p>
      </div>

      <div class="table-wrap" id="table-container" style="display:none">
        <table id="tabela"></table>
      </div>
    </main>

  </div>

  <!-- Modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <button class="modal-close" onclick="fecharModal()">×</button>
      <div class="modal-header">
        <span class="modal-emoji">📋</span>
        <div>
          <h2 id="modal-title">Editar Célula</h2>
          <p class="modal-sub" id="modal-sub">Selecione uma ação</p>
        </div>
      </div>

      <div id="senha-area">
        <div class="input-group">
          <label>🔑 Senha de acesso</label>
          <input type="password" id="senha-input" placeholder="Digite a senha..."
            onkeydown="if(event.key==='Enter') verificarSenha()">
        </div>
        <button class="btn-primary" onclick="verificarSenha()">Entrar</button>
      </div>

      <div id="acao-area" style="display:none">
        <p class="action-label">O que deseja fazer?</p>
        <div class="action-grid">
          <button class="action-btn reservar" onclick="selecionarAcao('reservar', this)">
            <span>📅</span> Reservar
          </button>
          <button class="action-btn bloquear" onclick="selecionarAcao('bloquear', this)">
            <span>🔒</span> Bloquear
          </button>
          <button class="action-btn liberar" onclick="selecionarAcao('liberar', this)">
            <span>✅</span> Liberar
          </button>
          <button class="action-btn limpar" onclick="selecionarAcao('limpar', this)">
            <span>🗑️</span> Limpar
          </button>
        </div>

        <div class="name-area" id="name-area">
          <div class="input-group">
            <label>👤 Nome do professor</label>
            <input type="text" id="nome-input" placeholder="Seu nome completo..."
              onkeydown="if(event.key==='Enter') confirmarAcao()">
          </div>
        </div>

        <button class="btn-primary" id="confirm-btn" onclick="confirmarAcao()" style="display:none">
          ✔ Confirmar
        </button>
      </div>

      <p class="error-msg" id="error-msg"></p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
